# Apply after queue/capacity overrides; observation takes no mutation queue slot.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -B {{AR_LOCAL_REPO}}/pi_ingest_observe.py
ExecStopPost=
TimeoutStartSec=60s
TimeoutStopSec=5s
ProtectSystem=strict
PrivateTmp=yes
Environment=AR_LOCAL_CODE_ROOT={{AR_LOCAL_REPO}}
UnsetEnvironment=AR_LOCAL_DRIVE_BACKUP_SPOOL
