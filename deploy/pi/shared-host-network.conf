[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/ar-local-shared-host/pi_shared_network_watchdog.py
Environment=AR_LOCAL_REPO=/srv/ar-local/AR-local
Environment=AR_LOCAL_DATA_ROOT=/srv/ar-local/data
RuntimeDirectory=ar-local-net-watchdog
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
Nice=15
CPUQuota=25%
CPUWeight=10
IOWeight=10
MemoryMax=128M
LimitAS=128M
TimeoutStartSec=60s
