[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I -S /usr/local/lib/ar-local-shared-host/pi_shared_network_watchdog.py
User={{AR_LOCAL_USER}}
Group={{AR_LOCAL_GROUP}}
Environment=AR_LOCAL_DATA_ROOT={{AR_LOCAL_DATA_ROOT}}
RuntimeDirectory=ar-local-net-watchdog
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
Nice=15
CPUQuota=25%
CPUWeight=10
IOWeight=10
MemoryMax=128M
LimitAS=128M
TimeoutStartSec=150s
KillMode=control-group
TimeoutStopSec=15s
SendSIGKILL=yes
