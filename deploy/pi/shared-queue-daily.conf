[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/shared-pi-queue/pi_shared_queue.py run --project ar-local --resource ar-local --mode exclusive --cpu-slots 3 --wait-timeout 21600 --max-runtime 21600 -- /usr/bin/python3 {{AR_LOCAL_REPO}}/pi_daily_sync.py --banks-only --skip-git-sync
# Six-hour wait + six-hour command + one hour for bounded inherited hooks.
TimeoutStartSec=46800s
KillMode=control-group
# Up to 64 privileged environment reads (10s each), service inspection and restore.
TimeoutStopSec=900s
SendSIGKILL=yes
ExecStopPost=
ExecStopPost=/usr/bin/python3 /usr/local/lib/shared-pi-queue/pi_shared_queue_stop_hook.py
