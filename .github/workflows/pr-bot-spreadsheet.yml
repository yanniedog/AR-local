name: pr-bot-spreadsheet

# Publish an Actions matrix (Markdown + HTML + JSON): rows = merged PRs, columns = review bots,
# color-coded by feedback presence, address-before-merge, and quota/limit hits.
on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      limit:
        description: Max merged PRs to sync
        required: false
        default: '50'
      pr_number:
        description: Optional single PR number
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-bot-spreadsheet
  cancel-in-progress: false

jobs:
  sync-matrix:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate matrix and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MATRIX_LIMIT: ${{ inputs.limit || '50' }}
          MATRIX_PR: ${{ inputs.pr_number }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, mkdtempSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const limit = process.env.MATRIX_LIMIT;
          const pr = process.env.MATRIX_PR || '';
          if (!/^[1-9][0-9]{0,2}$/.test(limit) || Number(limit) > 100) {
            throw new Error('limit must be an integer from 1 through 100');
          }
          if (pr && !/^[1-9][0-9]{0,8}$/.test(pr)) {
            throw new Error('pr_number must be a positive integer of at most 9 digits');
          }
          const output = mkdtempSync(path.join(process.env.RUNNER_TEMP, 'pr-bot-matrix-'));
          const args = ['run', 'pr:bot-spreadsheet:sync', '--', '--limit', limit, '--output-dir', output];
          if (pr) args.push('--pr', pr);
          const result = spawnSync('npm', args, { stdio: 'inherit' });
          if (result.error) throw result.error;
          if (result.status !== 0) process.exit(result.status || 1);
          const summary = readFileSync(path.join(output, 'pr-bot-matrix.md'), 'utf8').split('\n## Machine-readable data\n')[0];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n\nDownload all three files from this run's matrix artifact.\n`);
          appendFileSync(process.env.GITHUB_ENV, `MATRIX_OUTPUT=${output}\n`);
          NODE
      - name: Retain matrix files
        uses: actions/upload-artifact@v4
        with:
          name: pr-bot-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MATRIX_OUTPUT }}/pr-bot-matrix.md
            ${{ env.MATRIX_OUTPUT }}/pr-bot-matrix.html
            ${{ env.MATRIX_OUTPUT }}/pr-bot-matrix.json
          if-no-files-found: error
          retention-days: 30
