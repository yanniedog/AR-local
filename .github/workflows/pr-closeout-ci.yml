name: pr-closeout-ci
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'wait_for_bots.mjs'
      - 'package.json'
      - '.github/workflows/**'
      - '.github/rulesets/**'
      - '.github/MERGE_POLICY.md'
      - 'WORKFLOW.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wait_for_bots.mjs'
      - 'package.json'
      - '.github/workflows/**'
      - '.github/rulesets/**'
      - '.github/MERGE_POLICY.md'
      - 'WORKFLOW.md'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  closeout-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run pr:automation:verify
