name: "Automated Gemini Code Review"
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs do not receive GEMINI_API_KEY / write tokens on pull_request.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gemini-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preserve review outcome handler
        run: |
          cp scripts/gemini-review-status.py "$RUNNER_TEMP/gemini-review-status.py"
          rm -f review.txt

      - name: "Run AI Code Review"
        id: gemini
        # Handle quota exhaustion separately; the next step fails other errors.
        continue-on-error: true
        # Pin v2 tag (ecc2434…) so the secret-backed action cannot drift via a mutable tag.
        uses: sshnaidm/gemini-code-review-action@ecc2434351ef76b0084b788a3d61ec7d3acf44f9 # v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-flash-latest"
          review-title: |
            <!-- gemini-code-review -->
            # Code Review by Gemini
          prompt: |
            You are a senior developer reviewing a Pull Request. Check for logic errors, performance issues, and edge cases.
            If reviewing Pine Script:
            - Enforce Pine Script v6 syntax exclusively.
            - Flag any use of ta.sum and suggest math.sum instead.
            - Ensure any step values used in inputs are 1 or greater.
            - Flag any attempts to use dashed or dotted styles with plot() (e.g. plot.style_dashed), advising line or hline functions instead.
            If reviewing Home Assistant YAML:
            - Check for valid syntax and standard formatting.
            If reviewing Python:
            - Check for algorithmic efficiency and clear logical structures.

      - name: Check review outcome
        if: ${{ !cancelled() }}
        env:
          REVIEW_OUTCOME: ${{ steps.gemini.outcome }}
        run: python "$RUNNER_TEMP/gemini-review-status.py" "$REVIEW_OUTCOME" review.txt
