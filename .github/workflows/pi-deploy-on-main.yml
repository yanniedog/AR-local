# Manually deploy one exact, shadow-canary-approved AR-local commit.
# Main pushes never deploy. The approved commit and immutable canary release
# must match protected repository variables before this workflow can reach SSH.
#
# Secrets (Settings → Secrets and variables → Actions):
#   PI_SSH_PRIVATE_KEY, PI_SSH_HOST, PI_SSH_KNOWN_HOSTS — required
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET — required for GitHub-hosted runners (Pi is on Tailscale)
# Optional: PI_SSH_USER (default pi), variable AR_PI_BASE_URL
#
# Required variables:
#   AR_PI_CANARY_APPROVED_COMMIT, AR_PI_CANARY_MANIFEST_SHA256,
#   AR_PI_CANARY_RELEASE_TAG

name: pi-deploy-canary

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Exact 40-character AR-local main commit verified by canary"
        required: true
        type: string
      canary_manifest_sha256:
        description: "SHA-256 of the reviewed canary acceptance manifest"
        required: true
        type: string
      canary_release_tag:
        description: "Immutable GitHub release containing canary-acceptance.json"
        required: true
        type: string
      confirm_deploy:
        description: "Explicit production activation confirmation"
        required: true
        default: "NOT_APPROVED"
        type: choice
        options:
          - "NOT_APPROVED"
          - "DEPLOY_VERIFIED_CANARY"
      dry_run:
        description: "Print deploy steps only (no remote changes)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: pi-production-deploy
  cancel-in-progress: false

jobs:
  pi-deploy:
    runs-on: ubuntu-latest
    environment: pi-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_commit }}

      - name: Verify canary approval and exact main commit
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          CANARY_MANIFEST_SHA256: ${{ inputs.canary_manifest_sha256 }}
          CANARY_RELEASE_TAG: ${{ inputs.canary_release_tag }}
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          APPROVED_COMMIT: ${{ vars.AR_PI_CANARY_APPROVED_COMMIT }}
          APPROVED_MANIFEST_SHA256: ${{ vars.AR_PI_CANARY_MANIFEST_SHA256 }}
          APPROVED_RELEASE_TAG: ${{ vars.AR_PI_CANARY_RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANARY_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANARY_RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$CONFIRM_DEPLOY" = "DEPLOY_VERIFIED_CANARY"
          test "$TARGET_COMMIT" = "$APPROVED_COMMIT"
          test "$CANARY_MANIFEST_SHA256" = "$APPROVED_MANIFEST_SHA256"
          test "$CANARY_RELEASE_TAG" = "$APPROVED_RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TARGET_COMMIT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable canary acceptance manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          CANARY_MANIFEST_SHA256: ${{ inputs.canary_manifest_sha256 }}
          CANARY_RELEASE_TAG: ${{ inputs.canary_release_tag }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/canary-release.json"
          MANIFEST="$RUNNER_TEMP/canary-acceptance.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CANARY_RELEASE_TAG" > "$RELEASE_JSON"
          test "$(jq -r '.draft' "$RELEASE_JSON")" = "false"
          test "$(jq -r '.immutable' "$RELEASE_JSON")" = "true"
          test "$(jq '[.assets[] | select(.name == "canary-acceptance.json")] | length' "$RELEASE_JSON")" = "1"
          ASSET_ID="$(jq -r '.assets[] | select(.name == "canary-acceptance.json") | .id' "$RELEASE_JSON")"
          test -n "$ASSET_ID"
          git fetch origin "refs/tags/$CANARY_RELEASE_TAG:refs/tags/$CANARY_RELEASE_TAG"
          test "$(git rev-parse "refs/tags/${CANARY_RELEASE_TAG}^{commit}")" = "$TARGET_COMMIT"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$MANIFEST"
          python pi_canary_acceptance.py \
            --manifest "$MANIFEST" \
            --expected-sha256 "$CANARY_MANIFEST_SHA256" \
            --expected-commit "$TARGET_COMMIT" \
            --expected-repository "$GITHUB_REPOSITORY"

      - name: Verify Pi connection configuration
        id: secrets
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_PRIVATE_KEY"
          test -n "$PI_SSH_HOST"
          test -n "$PI_SSH_KNOWN_HOSTS"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Detect runner environment
        id: runner_env
        run: |
          # runner.environment is not a valid context; use self-hosted label instead.
          if echo "${{ join(runner.labels, ' ') }}" | grep -qE '(^| )self-hosted( |$)'; then
            echo "requires_tailscale=false" >> "$GITHUB_OUTPUT"
          else
            echo "requires_tailscale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Tailscale OAuth (hosted runner → tailnet)
        id: tailscale
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require hosted-runner Tailscale credentials
        if: >-
          steps.runner_env.outputs.requires_tailscale == 'true' &&
          steps.tailscale.outputs.configured != 'true'
        run: |
          echo "::error::A hosted production deploy requires TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET."
          exit 1

      - name: Join Tailscale tailnet
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          steps.runner_env.outputs.requires_tailscale == 'true' &&
          steps.tailscale.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_SSH_HOST }}
          version: latest

      - name: Configure SSH for Pi
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_deploy_key
          chmod 600 ~/.ssh/pi_deploy_key
          USER="${PI_SSH_USER:-pi}"
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ar-local-pi5
            HostName ${PI_SSH_HOST}
            User ${USER}
            IdentityFile ~/.ssh/pi_deploy_key
            BatchMode yes
            ConnectTimeout 60
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy exact approved commit and verify
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          (
            steps.runner_env.outputs.requires_tailscale != 'true' ||
            steps.tailscale.outputs.configured == 'true'
          )
        env:
          AR_PI_SSH_HOST: ar-local-pi5
          AR_PI_BASE_URL: ${{ vars.AR_PI_BASE_URL }}
          AR_PI_AR_LOCAL_REPO: /srv/ar-local/AR-local
          AR_PI_SITE_REPO: /srv/ar-local/australianrates
          AR_PI_EXPECTED_COMMIT: ${{ inputs.target_commit }}
        run: |
          export AR_PI_BASE_URL="${AR_PI_BASE_URL:-http://100.78.28.10/}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python pi_deploy_verify.py --deploy --expected-commit "$AR_PI_EXPECTED_COMMIT" --dry-run
          else
            python pi_deploy_verify.py --deploy --expected-commit "$AR_PI_EXPECTED_COMMIT"
          fi

      - name: Deploy result
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          (
            steps.runner_env.outputs.requires_tailscale != 'true' ||
            steps.tailscale.outputs.configured == 'true'
          )
        run: |
          echo "pi-deploy-canary: finished (see Deploy Pi step log)"
