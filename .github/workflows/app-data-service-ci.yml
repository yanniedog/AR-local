name: app-data-service-ci
on:
  pull_request:
    paths: ['services/app-data/**', 'app_payload_secure_upload.py', '.github/workflows/app-data-service-ci.yml']
  push:
    branches: [main]
    paths: ['services/app-data/**', 'app_payload_secure_upload.py', '.github/workflows/app-data-service-ci.yml']
permissions:
  contents: read
jobs:
  service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test services/app-data/worker.test.mjs
