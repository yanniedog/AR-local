name: historical-candidate-ci

on:
  pull_request:
    paths:
      - 'cdr_historical_*.py'
      - 'contracts/historical/**'
      - 'docs/HISTORICAL_CANDIDATE_V1.md'
      - 'tests/test_cdr_historical_*.py'
      - '.github/workflows/historical-candidate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cdr_historical_*.py'
      - 'contracts/historical/**'
      - 'docs/HISTORICAL_CANDIDATE_V1.md'
      - 'tests/test_cdr_historical_*.py'
      - '.github/workflows/historical-candidate-ci.yml'

permissions:
  contents: read

jobs:
  portable-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --quiet -r requirements.txt openpyxl pytest
      - name: Verify dormant historical contracts
        run: >-
          python -m pytest -q
          tests/test_cdr_historical_contract.py
          tests/test_cdr_historical_source.py
          tests/test_cdr_historical_parity.py
          tests/test_cdr_historical_candidate.py
          tests/test_cdr_historical_acceptance.py
