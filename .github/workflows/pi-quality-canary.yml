# Run the D-027 guarded quality canary for one exact AR-local main commit on
# the Pi, over the same hosted-runner Tailscale/SSH route as pi-deploy-canary.
#
# Manual dispatch only. The canary is private replay acceptance; it never
# seals, activates, deploys or publishes. Sealing and pi-deploy-canary remain
# separate controlled steps. `preflight` mode is read-only.
#
# The candidate checkout (/srv/ar-local/quality-candidate) is moved only to the
# exact requested commit and only when clean. Production, data and timers are
# untouched by this workflow; the helper enforces its own window, idle-ingest,
# disk and resource gates and fails closed.
name: pi-quality-canary

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Exact 40-character AR-local commit; must equal current main"
        required: true
        type: string
      mode:
        description: "preflight (read-only) or canary"
        required: true
        default: "preflight"
        type: choice
        options:
          - "preflight"
          - "canary"
      confirm:
        description: "Type RUN_GUARDED_CANARY for canary mode"
        required: false
        default: ""
        type: string
      python:
        description: "Absolute path to the prepared Python with runtime+test deps"
        required: true
        type: string
      dispositions:
        description: "Absolute path to reviewed historical-dispositions JSON"
        required: true
        default: "/srv/ar-local/quality-evidence/historical-dispositions.json"
        type: string
      dispositions_sha256:
        description: "Reviewed SHA-256 of the dispositions file (required for canary)"
        required: false
        default: ""
        type: string
      pressure_profile:
        description: "Helper pressure profile"
        required: true
        default: "legacy"
        type: choice
        options:
          - "legacy"
          - "allocation-v1"

permissions:
  contents: read

concurrency:
  group: pi-production-deploy
  cancel-in-progress: false

jobs:
  quality-canary:
    # Production secrets are only granted to the reviewed default-branch
    # workflow definition, never to a dispatch from another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pi-production
    timeout-minutes: 150
    steps:
      - name: Validate inputs and exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          DISP_SHA: ${{ inputs.dispositions_sha256 }}
          PY: ${{ inputs.python }}
          DISP: ${{ inputs.dispositions }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PY" =~ ^/[A-Za-z0-9._/+-]+$ ]]
          [[ "$DISP" =~ ^/[A-Za-z0-9._/+-]+$ ]]
          if [ "$MODE" = "canary" ]; then
            test "$CONFIRM" = "RUN_GUARDED_CANARY"
            [[ "$DISP_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::canary requires dispositions_sha256"; exit 1; }
          fi
          MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$MAIN" = "$TARGET_COMMIT" || { echo "::error::target $TARGET_COMMIT is not current main $MAIN"; exit 1; }

      - name: Require Pi and Tailscale credentials
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          for v in PI_SSH_PRIVATE_KEY PI_SSH_HOST PI_SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            test -n "${!v}" || { echo "::error::$v missing"; exit 1; }
          done

      - name: Join Tailscale tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_SSH_HOST }}
          version: latest

      - name: Configure SSH for Pi
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_deploy_key
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pi_deploy_key ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ar-local-pi5
            HostName ${PI_SSH_HOST}
            User ${PI_SSH_USER:-pi}
            IdentityFile ~/.ssh/pi_deploy_key
            BatchMode yes
            ConnectTimeout 60
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Read-only Pi preflight
        env:
          PY: ${{ inputs.python }}
          DISP: ${{ inputs.dispositions }}
        run: |
          set -uo pipefail
          ssh ar-local-pi5 bash -s -- "$PY" "$DISP" <<'REMOTE'
          set -u
          PY="$1"; DISP="$2"; C=/srv/ar-local/quality-candidate
          echo "hobart: $(TZ=Australia/Hobart date -Is)"
          echo "production HEAD: $(git -C /srv/ar-local/AR-local rev-parse HEAD 2>&1)"
          echo "production dirty: $(git -C /srv/ar-local/AR-local status --porcelain | wc -l)"
          echo "candidate HEAD: $(git -C "$C" rev-parse HEAD 2>&1)"
          echo "candidate dirty: $(git -C "$C" status --porcelain 2>&1 | wc -l)"
          ORIGIN="$(git -C "$C" remote get-url origin 2>&1 || true)"
          case "$ORIGIN" in
            https://github.com/yanniedog/AR-local.git|https://github.com/yanniedog/AR-local|git@github.com:yanniedog/AR-local.git)
              echo "candidate origin: $ORIGIN" ;;
            *) echo "candidate origin: NOT CANONICAL (value withheld)" ;;
          esac
          systemctl show ar-local-daily.service -p ActiveState -p Result -p ExecMainExitTimestamp 2>&1 | sed 's/^/daily last run: /'
          test -x "$PY" && echo "python: $("$PY" --version 2>&1)" || echo "python: MISSING $PY"
          test -f "$DISP" && echo "dispositions sha256: $(sha256sum "$DISP" | cut -d' ' -f1)" || echo "dispositions: MISSING $DISP"
          test -x /usr/local/bin/pi-shared-task && echo "pi-shared-task: present" || echo "pi-shared-task: MISSING"
          systemctl is-active ar-local-daily.service 2>&1 | sed 's/^/daily service: /'
          systemctl is-enabled ar-local-daily.timer 2>&1 | sed 's/^/daily timer enabled: /'
          systemctl list-timers ar-local-daily.timer --no-pager 2>&1 | sed -n 2p | sed 's/^/daily timer next: /'
          sudo -n -l /usr/bin/systemd-run >/dev/null 2>&1 && echo "sudo systemd-run: allowed" || echo "sudo systemd-run: NOT allowed non-interactively"
          sudo -n -l /usr/bin/systemctl >/dev/null 2>&1 && echo "sudo systemctl: allowed" || echo "sudo systemctl: NOT allowed non-interactively"
          df -h /srv/ar-local | tail -1
          grep -E 'MemAvailable' /proc/meminfo
          ls -1d /srv/ar-local/quality-operation-* 2>/dev/null | tail -5 || true
          REMOTE

      # Everything that touches the candidate tree runs only after shared-queue
      # admission, inside the queued command. The submitter is detached with
      # its PID recorded outside the operation directory, so SSH loss (SIGHUP)
      # or workflow cancellation can still be converted into the submitter's
      # own SIGTERM cancellation path, which stops the exact queued unit.
      - name: Run guarded canary under shared-queue admission
        if: inputs.mode == 'canary'
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          PY: ${{ inputs.python }}
          DISP: ${{ inputs.dispositions }}
          DISP_SHA: ${{ inputs.dispositions_sha256 }}
          PROFILE: ${{ inputs.pressure_profile }}
          OP_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh ar-local-pi5 bash -s -- "$TARGET_COMMIT" "$PY" "$DISP" "$PROFILE" "$OP_ID" "$DISP_SHA" <<'REMOTE'
          set -euo pipefail
          COMMIT="$1"; PY="$2"; DISP="$3"; PROFILE="$4"; OP_ID="$5"; DISP_SHA="$6"
          CTL=/srv/ar-local/quality-gh-control
          mkdir -p "$CTL"
          PIDF="$CTL/$OP_ID.submitter.pid"
          test ! -e "$PIDF" || { echo "submitter record $PIDF already exists"; exit 1; }
          QUEUED='set -euo pipefail
          COMMIT="$1"; PY="$2"; DISP="$3"; PROFILE="$4"; OP_ID="$5"; DISP_SHA="$6"
          C=/srv/ar-local/quality-candidate
          OP="/srv/ar-local/quality-operation-$OP_ID"
          NOW_HM="$(TZ=Australia/Hobart date +%H%M)"
          [ "$NOW_HM" -ge 0330 ] && [ "$NOW_HM" -lt 2200 ] || { echo "outside 03:30-22:00 Hobart"; exit 1; }
          D_ACTIVE="$(systemctl show ar-local-daily.service -p ActiveState --value)"
          D_RESULT="$(systemctl show ar-local-daily.service -p Result --value)"
          D_EXIT="$(systemctl show ar-local-daily.service -p ExecMainExitTimestamp --value)"
          [ "$D_ACTIVE" = inactive ] && [ "$D_RESULT" = success ] || { echo "daily ingest not terminally successful ($D_ACTIVE/$D_RESULT)"; exit 1; }
          D_DAY="$(TZ=Australia/Hobart date -d "$D_EXIT" +%F 2>/dev/null || echo none)"
          [ "$D_DAY" = "$(TZ=Australia/Hobart date +%F)" ] || { echo "today natural ingest/validation has not completed (last exit: $D_EXIT)"; exit 1; }
          case "$(git -C "$C" remote get-url origin)" in
            https://github.com/yanniedog/AR-local.git|https://github.com/yanniedog/AR-local|git@github.com:yanniedog/AR-local.git) ;;
            *) echo "candidate origin is not the canonical AR-local URL"; exit 1 ;;
          esac
          test -z "$(git -C "$C" status --porcelain)" || { echo "candidate checkout is dirty; refusing"; exit 1; }
          test ! -e "$OP" || { echo "operation $OP already exists"; exit 1; }
          git -C "$C" fetch --quiet origin main
          test "$(git -C "$C" rev-parse FETCH_HEAD)" = "$COMMIT" || { echo "fetched main != $COMMIT"; exit 1; }
          git -C "$C" checkout --quiet --detach "$COMMIT"
          test "$(git -C "$C" rev-parse HEAD)" = "$COMMIT"
          DCOPY="/srv/ar-local/quality-gh-control/$OP_ID.dispositions.json"
          test ! -e "$DCOPY" || { echo "dispositions copy already exists"; exit 1; }
          (umask 077; cp --no-preserve=all "$DISP" "$DCOPY")
          chmod 0400 "$DCOPY"
          test "$(sha256sum "$DCOPY" | cut -d" " -f1)" = "$DISP_SHA" || { echo "dispositions SHA-256 differs from reviewed value; refusing"; exit 1; }
          echo "operation: $OP"
          exec "$PY" "$C/pi_cdr_quality_activate.py" canary \
            --source "$C" \
            --production /srv/ar-local/AR-local --data-root /srv/ar-local/data \
            --operation "$OP" --expected-commit "$COMMIT" --python "$PY" \
            --dispositions "$DCOPY" --pressure-profile "$PROFILE"'
          setsid /usr/local/bin/pi-shared-task --project ar-local --resource ar-local \
            --cpu-slots 2 --max-runtime 6000 --wait-timeout 1800 -- \
            /bin/bash -c "$QUEUED" queued-canary "$COMMIT" "$PY" "$DISP" "$PROFILE" "$OP_ID" "$DISP_SHA" &
          SUB=$!
          echo "$SUB $OP_ID" > "$PIDF"
          trap 'kill -TERM "$SUB" 2>/dev/null || true' HUP TERM INT
          set +e
          wait "$SUB"; RC=$?
          while kill -0 "$SUB" 2>/dev/null; do wait "$SUB"; RC=$?; done
          set -e
          rm -f "$PIDF"
          echo "pi-shared-task exit: $RC"
          OP="/srv/ar-local/quality-operation-$OP_ID"
          if [ -f "$OP/canary.json" ]; then
            echo "canary.json sha256: $(sha256sum "$OP/canary.json" | cut -d' ' -f1)"
            python3 - "$OP/canary.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          # Full report (including disposition reasons) stays on the Pi.
          for k, v in r.items():
              if "disposition" in k.lower():
                  continue
              if isinstance(v, (str, int, float, bool)) or v is None:
                  print(f"{k}: {v}")
          PY
          else
            echo "canary.json not produced"
          fi
          exit "$RC"
          REMOTE

      # Always runs for canary mode: first cancel a still-live submitter
      # (pending or admitted) through its own SIGTERM path, then reap the
      # helper's separate `sudo systemd-run` unit after matching its
      # canary-unit.json identity to this exact operation.
      - name: Stop and verify queued submission and canary unit
        if: always() && inputs.mode == 'canary'
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          OP_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh ar-local-pi5 bash -s -- "$TARGET_COMMIT" "$OP_ID" <<'REMOTE'
          set -euo pipefail
          COMMIT="$1"; OP_ID="$2"
          PIDF="/srv/ar-local/quality-gh-control/$OP_ID.submitter.pid"
          if [ -f "$PIDF" ]; then
            read -r SUB REC_OP < "$PIDF"
            if [ "$REC_OP" = "$OP_ID" ] && kill -0 "$SUB" 2>/dev/null \
               && tr '\0' ' ' < "/proc/$SUB/cmdline" | grep -q "pi-shared-task.*queued-canary.* $OP_ID "; then
              echo "cancelling live submitter $SUB"
              kill -TERM "$SUB"
              for _ in $(seq 1 75); do kill -0 "$SUB" 2>/dev/null || break; sleep 2; done
              if kill -0 "$SUB" 2>/dev/null; then echo "submitter $SUB did not exit"; exit 1; fi
            fi
            rm -f "$PIDF"
          fi
          OP="/srv/ar-local/quality-operation-$OP_ID"
          R="$OP/canary-unit.json"
          if [ ! -f "$R" ]; then echo "no canary-unit.json; helper never launched its unit"; exit 0; fi
          UNIT="$(python3 - "$R" "$OP" "$COMMIT" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          ok = (r.get("schema_version") == 1 and r.get("operation") == sys.argv[2]
                and r.get("source") == "/srv/ar-local/quality-candidate"
                and r.get("expected_commit") == sys.argv[3]
                and str(r.get("unit", "")).endswith(".service"))
          print(r["unit"] if ok else "")
          PY
          )"
          test -n "$UNIT" || { echo "canary-unit.json identity mismatch; not stopping anything"; exit 1; }
          STATE="$(systemctl is-active "$UNIT" 2>/dev/null || true)"
          echo "unit $UNIT state: $STATE"
          case "$STATE" in
            active|activating|deactivating|reloading) sudo -n systemctl stop "$UNIT" ;;
          esac
          for _ in $(seq 1 30); do
            STATE="$(systemctl is-active "$UNIT" 2>/dev/null || true)"
            case "$STATE" in active|activating|deactivating|reloading) sleep 2 ;; *) break ;; esac
          done
          echo "unit $UNIT final state: $STATE"
          case "$STATE" in active|activating|deactivating|reloading) exit 1 ;; esac
          REMOTE
