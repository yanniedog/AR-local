# Guarantee a GitHub app payload for every observed date, over the hosted-runner
# Tailscale/SSH route used by pi-quality-canary.
#
# Operator decisions (repository owner):
# - 2026-11-06: observations withheld solely by `unverified_provider_population`
#   may be published (`policy: population`).
# - 2026-11-07: a GitHub payload must ALWAYS exist for every date. Upstream CDR
#   data for past dates is gone; the Pi's retained capture is the only copy, so
#   any withheld observation is published with its coverage disclosed
#   (`policy: all`). Integrity (sealed contract/ledger/marker binding) is never
#   waived.
# scripts/pi_population_waiver_publish.py drives the production checkout's own
# daily publication path (pi_daily_sync.maybe_publish_app_payload), so payload
# format, revision coordination, encryption, dates index and the pending-marker
# queue behave exactly as on a natural daily retry. A waiver applies only to the
# exact contract digests the preceding report saw.
#
# Schedule: twice daily inside the 03:30-22:00 Hobart retry window, publish every
# withheld date since AUTHORISED_FROM with `policy: all`, then fail the run (and
# so notify) if any date from AUTHORISED_FROM to yesterday still has no dated
# release.
#
# Guards:
# - main-branch definition only; typed confirmation for manual publish;
#   dates limited to AUTHORISED_FROM through today (Hobart);
# - admitted through the shared Pi queue (`pi-shared-task`), then run in bounded
#   transient units as the daily service user with its environment, under the
#   production daily-ingest lock and the daily retry window;
# - the production checkout must be clean and is imported unmodified;
# - `inventory` and `report` write nothing.
name: pi-payload-backfill

on:
  schedule:
    - cron: "45 18 * * *"   # 05:45 AEDT / 04:45 AEST
    - cron: "15 8 * * *"    # 19:15 AEDT / 18:15 AEST
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory / report (read-only) or publish"
        required: true
        default: "report"
        type: choice
        options:
          - "inventory"
          - "report"
          - "publish"
      policy:
        description: "all (any verdict; payload for every date) or population"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "population"
      dates:
        description: "Space-separated YYYY-MM-DD dates; empty = every withheld date since AUTHORISED_FROM"
        required: false
        default: ""
        type: string
      confirm:
        description: "publish: PUBLISH_OVER_ALL_POLICY (policy all) or PUBLISH_OVER_POPULATION_GATE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  AUTHORISED_FROM: "2026-10-29"

concurrency:
  group: pi-production-deploy
  cancel-in-progress: false

jobs:
  payload-backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate inputs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          POLICY: ${{ inputs.policy }}
          CONFIRM: ${{ inputs.confirm }}
          DATES: ${{ inputs.dates }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then MODE=publish; POLICY=all; DATES=""; fi
          case "$POLICY" in all) want=PUBLISH_OVER_ALL_POLICY ;; population) want=PUBLISH_OVER_POPULATION_GATE ;;
            *) echo "::error::unknown policy"; exit 1 ;; esac
          case "$MODE" in inventory|report|publish) ;; *) echo "::error::unknown mode"; exit 1 ;; esac
          if [ "$MODE" = "publish" ] && [ "$EVENT" != "schedule" ]; then
            test "$CONFIRM" = "$want" || { echo "::error::publish with policy $POLICY needs confirm=$want"; exit 1; }
          fi
          today="$(TZ=Australia/Hobart date +%F)"
          selected=""
          for d in $DATES; do
            [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::invalid date $d"; exit 1; }
            date -d "$d" +%F >/dev/null
            if [[ "$d" < "$AUTHORISED_FROM" || "$d" > "$today" ]]; then
              echo "::error::$d is outside the authorised range $AUTHORISED_FROM..$today"; exit 1
            fi
            selected="$selected $d"
          done
          selected="$(echo $selected | tr ' ' '\n' | sort -u | tr '\n' ' ')"
          since=""
          if [ -z "${selected// /}" ]; then
            [ "$MODE" != "inventory" ] || { echo "::error::inventory needs explicit dates"; exit 1; }
            since="$AUTHORISED_FROM"
          fi
          { echo "mode=$MODE"; echo "policy=$POLICY"; echo "dates=$selected"; echo "since=$since"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require Pi and Tailscale credentials
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          for v in PI_SSH_PRIVATE_KEY PI_SSH_HOST PI_SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            test -n "${!v}" || { echo "::error::$v missing"; exit 1; }
          done

      - name: Join Tailscale tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_SSH_HOST }}
          version: latest

      - name: Configure SSH for Pi
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_deploy_key
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pi_deploy_key ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ar-local-pi5
            HostName ${PI_SSH_HOST}
            User ${PI_SSH_USER:-pi}
            IdentityFile ~/.ssh/pi_deploy_key
            BatchMode yes
            ConnectTimeout 60
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Stage the reviewed runner on the Pi
        run: |
          set -euo pipefail
          SHA="$(sha256sum scripts/pi_population_waiver_publish.py | cut -d' ' -f1)"
          echo "runner sha256: $SHA"
          ssh ar-local-pi5 "install -d -m 0755 /srv/ar-local/payload-waiver-control && cat > /srv/ar-local/payload-waiver-control/runner-$SHA.py.tmp && chmod 0444 /srv/ar-local/payload-waiver-control/runner-$SHA.py.tmp && mv -f /srv/ar-local/payload-waiver-control/runner-$SHA.py.tmp /srv/ar-local/payload-waiver-control/runner-$SHA.py" < scripts/pi_population_waiver_publish.py
          test "$(ssh ar-local-pi5 sha256sum /srv/ar-local/payload-waiver-control/runner-$SHA.py | cut -d' ' -f1)" = "$SHA"
          echo "RUNNER_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Inventory, report and publish through the shared queue
        env:
          MODE: ${{ steps.select.outputs.mode }}
          POLICY: ${{ steps.select.outputs.policy }}
          SINCE: ${{ steps.select.outputs.since }}
          DATES: ${{ steps.select.outputs.dates }}
        run: |
          set -euo pipefail
          # Inputs travel as positional arguments, never interpolated into the
          # remote script text.
          ssh ar-local-pi5 bash -s -- "$MODE" "$POLICY" "${SINCE:--}" "$RUNNER_SHA" "$GITHUB_RUN_ID" $DATES <<'REMOTE'
          set -euo pipefail
          MODE="$1"; POLICY="$2"; SINCE="$3"; RSHA="$4"; RUN="$5"; shift 5
          REPO=/srv/ar-local/AR-local
          CTL=/srv/ar-local/payload-waiver-control
          RUNNER="$CTL/runner-$RSHA.py"
          test "$(sha256sum "$RUNNER" | cut -d' ' -f1)" = "$RSHA"
          cd "$REPO"
          echo "production HEAD: $(git rev-parse HEAD)"
          test -z "$(git status --porcelain)" || { echo "production checkout is dirty; refusing"; exit 1; }
          test -x /usr/local/bin/pi-shared-task || { echo "pi-shared-task missing; refusing"; exit 1; }
          QS="$CTL/queued-$RUN.sh"
          cat > "$QS" <<'QUEUED'
          set -euo pipefail
          MODE="$1"; POLICY="$2"; SINCE="$3"; RUNNER="$4"; RUN="$5"; shift 5
          REPO=/srv/ar-local/AR-local
          U="$(systemctl show -p User --value ar-local-daily.service)"
          G="$(systemctl show -p Group --value ar-local-daily.service)"
          test -n "$U" || { echo "daily service user unknown"; exit 1; }
          props=(-p "User=$U" -p "WorkingDirectory=$REPO" -p Type=exec -p KillMode=control-group
                 -p SendSIGKILL=yes -p Restart=no -p TimeoutStopSec=45 -p CPUQuota=200%)
          [ -n "$G" ] && props+=(-p "Group=$G")
          # Mirror the daily service environment (values contain no spaces).
          for kv in $(systemctl show -p Environment --value ar-local-daily.service); do props+=(-p "Environment=$kv"); done
          for f in /etc/ar-local/app-payload.env /etc/ar-local/drive-backup.env /etc/ar-local/day-archive.env; do
            props+=(-p "EnvironmentFile=-$f")
          done
          # Couple every child unit to this queue job: BindsTo stops it when the
          # queue's own unit stops (budget expiry or cancellation), and the trap
          # stops and verifies it before the claim is released.
          QUNIT="$(sed -n 's#^0::.*/\([^/]*\.service\)$#\1#p' /proc/self/cgroup)"
          [[ "$QUNIT" =~ ^[A-Za-z0-9@_.:-]+\.service$ ]] || { echo "queue unit unknown; refusing"; exit 1; }
          props+=(-p "BindsTo=$QUNIT" -p "After=$QUNIT")
          seq=0; CHILD=""
          stop_child() {
            [ -n "$CHILD" ] || return 0
            sudo systemctl stop "$CHILD" 2>/dev/null || true
            for _ in $(seq 1 30); do
              state="$(systemctl show -p ActiveState --value "$CHILD" 2>/dev/null || true)"
              case "$state" in ""|inactive|failed) CHILD=""; return 0 ;; esac
              sleep 2
            done
            echo "child $CHILD did not stop"; return 1
          }
          trap 'stop_child; exit 143' TERM INT HUP
          unit() {
            seq=$((seq + 1)); CHILD="ar-local-payload-waiver-$RUN-$seq.service"
            sudo systemd-run --quiet --wait --pipe --collect \
              --unit="$CHILD" "${props[@]}" -p RuntimeMaxSec="$1" \
              /usr/bin/python3 -I "$RUNNER" --repo "$REPO" --policy "$POLICY" "${@:2}" &
            local pid=$! rc=0
            wait "$pid" || rc=$?
            CHILD=""
            return "$rc"
          }
          sel=(); for d in "$@"; do sel+=(--date "$d"); done
          [ "$SINCE" = "-" ] || sel+=(--pending-since "$SINCE")
          if [ "$MODE" = "inventory" ]; then unit 900 --inventory "${sel[@]}"; exit $?; fi
          set +e
          OUT="$(mktemp)"
          unit 900 --report "${sel[@]}" >"$OUT" 2>&1; rrc=$?
          set -e
          report="$(cat "$OUT")"; rm -f "$OUT"
          echo "$report"
          if [ "$MODE" != "publish" ] || [ "$rrc" -eq 3 ]; then exit "$rrc"; fi
          # Publish every date the report admitted or found waivable, each pinned
          # to the digest the report saw; refused dates keep the run failing.
          rc="$rrc"
          while read -r d decision digest; do
            allow=(); [ "$decision" = "waivable" ] && allow=(--allow-digest "$d=$digest")
            # One date per unit, oldest first; each checks the retry window itself.
            unit 2100 --publish --date "$d" "${allow[@]}" || { rc=$?; echo "publication for $d failed (rc=$rc)"; }
          done < <(grep "^WAIVER " <<<"$report" | sed 's/^WAIVER //' | python3 -c 'import json,sys
          for r in map(json.loads, sys.stdin):
              if r.get("decision") in ("admitted", "waivable"): print(r["date"], r["decision"], r["contract_digest"])')
          exit "$rc"
          QUEUED
          chmod 0500 "$QS"
          set +e
          /usr/local/bin/pi-shared-task --project ar-local --resource ar-local \
            --cpu-slots 2 --max-runtime 14400 --wait-timeout 1800 -- \
            /bin/bash "$QS" "$MODE" "$POLICY" "$SINCE" "$RUNNER" "$RUN" "$@"
          RC=$?
          set -e
          rm -f "$QS"
          echo "pi-shared-task exit: $RC"
          exit "$RC"
          REMOTE

      - name: Require a dated payload release for every date
        if: always() && steps.select.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          end="$(TZ=Australia/Hobart date -d yesterday +%F)"
          d="$AUTHORISED_FROM"; missing=""
          while [[ ! "$d" > "$end" ]]; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-payload-$d" --jq .tag_name >/dev/null 2>&1 || missing="$missing $d"
            d="$(date -d "$d + 1 day" +%F)"
          done
          if [ -n "$missing" ]; then
            echo "::error::no dated GitHub payload release for:$missing"
            echo "Missing dated payload releases:$missing" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "Every date $AUTHORISED_FROM..$end has a dated payload release." >> "$GITHUB_STEP_SUMMARY"
