# Scheduled Pi deploy verification. Drift is reported but never repaired here;
# production activation is owned by the canary-gated manual deploy workflow.
# Secrets: PI_SSH_PRIVATE_KEY, PI_SSH_HOST, PI_SSH_KNOWN_HOSTS;
# TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET (for hosted runners).

name: pi-deploy-watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect Pi SSH secrets
        id: secrets
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
        run: |
          if [ -n "$PI_SSH_PRIVATE_KEY" ] && [ -n "$PI_SSH_HOST" ] && [ -n "$PI_SSH_KNOWN_HOSTS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect runner environment
        id: runner_env
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            echo "requires_tailscale=false" >> "$GITHUB_OUTPUT"
          else
            echo "requires_tailscale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Tailscale OAuth
        id: tailscale
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Join Tailscale tailnet
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          steps.runner_env.outputs.requires_tailscale == 'true' &&
          steps.tailscale.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_SSH_HOST }}
          version: latest

      - name: Configure SSH for Pi
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_deploy_key
          chmod 600 ~/.ssh/pi_deploy_key
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ar-local-pi5
            HostName ${PI_SSH_HOST}
            User ar-local-ci
            IdentityFile ~/.ssh/pi_deploy_key
            BatchMode yes
            ConnectTimeout 60
          EOF
          chmod 600 ~/.ssh/config

      - name: Fail verification (Pi SSH not configured)
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "::error::Pi deployment was not verified: SSH configuration is missing."
          echo "Pi deployment was not verified. Configure PI_SSH_PRIVATE_KEY, PI_SSH_HOST, and PI_SSH_KNOWN_HOSTS." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fail verification (Tailscale OAuth missing for hosted runner)
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          steps.runner_env.outputs.requires_tailscale == 'true' &&
          steps.tailscale.outputs.configured != 'true'
        run: |
          echo "::error::Pi deployment was not verified: Tailscale OAuth configuration is missing."
          echo "Pi deployment was not verified. Configure TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET for the hosted runner." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify Pi deploy
        id: verify
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          (
            steps.runner_env.outputs.requires_tailscale != 'true' ||
            steps.tailscale.outputs.configured == 'true'
          )
        env:
          AR_PI_SSH_HOST: ar-local-pi5
          AR_PI_BASE_URL: ${{ vars.AR_PI_BASE_URL }}
          AR_PI_AR_LOCAL_REPO: /srv/ar-local/AR-local
          AR_PI_SITE_REPO: /srv/ar-local/australianrates
        run: |
          set +e
          python pi_deploy_verify.py --restricted-ci --verify
          echo "exit=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail on drift or unhealthy runtime
        if: >-
          steps.secrets.outputs.configured == 'true' &&
          (
            steps.runner_env.outputs.requires_tailscale != 'true' ||
            steps.tailscale.outputs.configured == 'true'
          )
        env:
          VERIFY_EXIT: ${{ steps.verify.outputs.exit }}
        run: |
          if [ "$VERIFY_EXIT" = "0" ]; then
            echo "Pi deployment verification passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Pi deployment verification failed (exit $VERIFY_EXIT)." >> "$GITHUB_STEP_SUMMARY"
          echo "pi-deploy-watchdog: verify failed (exit $VERIFY_EXIT)"
          echo "Use the canary-gated pi-deploy-canary workflow after investigation."
          exit 1
