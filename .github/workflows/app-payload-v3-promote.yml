name: Dormant payload-v3 promotion

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed canonical candidate-workflow run on protected main
        required: true
        type: string
      candidate_artifact_name:
        description: Exact candidate artifact name
        required: true
        default: payload-v3-candidate
        type: string
      generation_id:
        description: Exact gen-YYYY-MM-DD-rNNNN-digest candidate directory
        required: true
        type: string
      execute:
        description: Execute append-only remote promotion after validation
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: app-payload-v3-promotion
  cancel-in-progress: false

jobs:
  validate-candidate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Verify canonical producer-run provenance
        id: producer
        env:
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_ARTIFACT_NAME" = "payload-v3-candidate"
          producer_commit="$(python app_payload_v3_github.py \
            --verify-candidate-run "$CANDIDATE_RUN_ID")"
          if [[ ! "$producer_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid verified producer commit" >&2
            exit 2
          fi
          printf 'producer_commit=%s\n' "$producer_commit" >> "$GITHUB_OUTPUT"
      - name: Download exact canonical candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: candidate-root
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate candidate without remote writes
        env:
          CANDIDATE_GENERATION_ID: ${{ inputs.generation_id }}
          EXPECTED_PRODUCER_COMMIT: ${{ steps.producer.outputs.producer_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_GENERATION_ID" =~ ^gen-[0-9]{4}-[0-9]{2}-[0-9]{2}-r[0-9]{4}-[0-9a-f]{12}$ ]]; then
            echo "Invalid generation_id" >&2
            exit 2
          fi
          python app_payload_v3_promotion.py \
            --candidate-dir "candidate-root/$CANDIDATE_GENERATION_ID" \
            --expected-producer-commit "$EXPECTED_PRODUCER_COMMIT"

  execute-promotion:
    if: ${{ github.ref == 'refs/heads/main' && inputs.execute == true }}
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: app-payload-v3-promotion
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require separately configured environment approval secret
        env:
          PROMOTION_APPROVAL: ${{ secrets.AR_V3_PROMOTION_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROMOTION_APPROVAL" = "APPROVED"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Re-verify canonical producer-run provenance
        id: producer
        env:
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_ARTIFACT_NAME" = "payload-v3-candidate"
          producer_commit="$(python app_payload_v3_github.py \
            --verify-candidate-run "$CANDIDATE_RUN_ID")"
          if [[ ! "$producer_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid verified producer commit" >&2
            exit 2
          fi
          printf 'producer_commit=%s\n' "$producer_commit" >> "$GITHUB_OUTPUT"
      - name: Download exact canonical candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: candidate-root
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Execute append-only promotion
        env:
          CANDIDATE_GENERATION_ID: ${{ inputs.generation_id }}
          EXPECTED_PRODUCER_COMMIT: ${{ steps.producer.outputs.producer_commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_GENERATION_ID" =~ ^gen-[0-9]{4}-[0-9]{2}-[0-9]{2}-r[0-9]{4}-[0-9a-f]{12}$ ]]; then
            echo "Invalid generation_id" >&2
            exit 2
          fi
          python app_payload_v3_promotion.py \
            --candidate-dir "candidate-root/$CANDIDATE_GENERATION_ID" \
            --expected-producer-commit "$EXPECTED_PRODUCER_COMMIT" \
            --execute
