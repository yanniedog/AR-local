name: pr-bot-feedback-check

# Thread closure gate. Runs on PR lifecycle AND on review-comment activity so an
# in-thread reply (or a bot posting a finding) re-evaluates the gate automatically
# - no manual re-run / empty re-trigger commit needed. One paginated GraphQL query
# per run; unresolved feedback fails promptly instead of holding a runner.
# Self-heal triggers are limited to events whose check-run attaches to the PR
# HEAD: pull_request (push) and pull_request_review[_comment] (these run with
# GITHUB_SHA = the PR head). NOT issue_comment / workflow_dispatch â€” those run
# against the default branch, so their check records against main, not the PR
# head, and would leave a failed required check stale (Codex P1 PR #148).
# NOTE: GitHub emits no event when a thread is *resolved*, so a resolve-only round
# (no reply, no push) won't auto-re-run a previously-failed gate. After resolving,
# reply inline on a review thread, push, or re-run THIS run on the PR head with
# `gh run rerun <run-id>` (a top-level PR comment will NOT refresh the PR-head check).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # GitHub enforces every duplicate required context. Keep PR-only runs queued
  # so cancellation cannot leave a blocking CANCELLED sibling on the head.
  group: bot-feedback-gate-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  bot-feedback-gate:
    if: >-
      github.event.pull_request != null
      || github.event.review != null
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Review gate automation tests
        run: npm run pr:automation:verify
      - name: Skip thread gate for non-human / chore PRs
        id: gate_exempt
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
          else
            PR="${{ github.event.pull_request.number }}"
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Pull request number must be numeric"; exit 1; }
          PR_STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
          if [ "$PR_STATE" != "open" ]; then
            echo "gate_exempt=true" >> "$GITHUB_OUTPUT"
            echo "gate_exempt_reason=pull-request-$PR_STATE" >> "$GITHUB_OUTPUT"
            echo "PR #$PR is $PR_STATE - stale review event skipped"
            exit 0
          fi
          export PR
          EXEMPT=$(node scripts/pr-gate-exempt-reason.mjs || true)
          if [ -n "$EXEMPT" ]; then
            echo "gate_exempt=true" >> "$GITHUB_OUTPUT"
            echo "gate_exempt_reason=$EXEMPT" >> "$GITHUB_OUTPUT"
            echo "PR #$PR is gate-exempt ($EXEMPT) — thread closure not required"
          else
            echo "gate_exempt=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate exempt — pass (no thread closure)
        if: steps.gate_exempt.outputs.gate_exempt == 'true'
        run: |
          echo "bot-feedback-gate: skipped (${{ steps.gate_exempt.outputs.gate_exempt_reason }} — human bot review not required)"
      - name: Review thread closure gate
        if: steps.gate_exempt.outputs.gate_exempt != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
          else
            PR="${{ github.event.pull_request.number }}"
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Pull request number must be numeric"; exit 1; }
          set +e
          npm run pr:bot-feedback-check -- --pr "$PR" --skip-bot-presence
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "::error::GitHub API rate limit prevented the feedback audit; rerun this check."
          elif [ "$code" -eq 3 ]; then
            echo "::error::Substantive review feedback remains open. Reply and resolve it; the reply event will re-run this gate."
          else
            echo "::error::Feedback gate execution failed permanently (exit $code)."
          fi
          exit "$code"
