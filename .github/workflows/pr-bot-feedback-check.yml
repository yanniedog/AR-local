name: pr-bot-feedback-check

# Only trusted default-branch code gets checks:write. PR code and artifacts are
# never executed here. The required check is published on the current PR head,
# not on the default-branch SHA used by these event-driven reporter jobs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [app-ci, app-data-service-ci, historical-candidate-ci, pr-closeout-ci, pr-review-events]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose current gates should be refreshed
        required: true
        type: string
      retired_head:
        description: Optional previous 40-character head SHA whose owned pending evaluations should be retired
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  retire-previous-head:
    # Do not put this job in replaceable per-PR concurrency: a later push can
    # otherwise drop the only event naming a force-pushed-away prior SHA.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action == 'synchronize') ||
      (github.event_name == 'workflow_dispatch' && inputs.retired_head != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retire owned pending checks on the previous PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-required-gate.mjs --retire-event

  discover:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      (github.event_name != 'workflow_run' ||
       contains(fromJSON('["pull_request", "pull_request_review", "pull_request_review_comment"]'), github.event.workflow_run.event))
    # Discovery only reads current state. Coalesce repeated lifecycle events for
    # one source run, or direct events for one PR, before allocating a runner.
    # Prior-head retirement remains an independent, non-cancellable job.
    concurrency:
      group: required-pr-gate-discover-${{ github.event_name == 'workflow_run' && format('run-{0}', github.event.workflow_run.id) || format('pr-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.targets.outputs.prs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve current PR targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-required-gate.mjs --discover

  evaluate-gates:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    # A replaced pending reporter is harmless: the next reporter for THIS PR
    # evaluates current state. Do not share a concurrency group between PRs.
    concurrency:
      group: required-pr-gate-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish feedback and applicable CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_PR: ${{ matrix.pr }}
        run: node scripts/pr-required-gate.mjs --publish
