name: pr-review-events

# An unprivileged signal only. The trusted workflow_run reporter reads live
# threads; it never consumes this run's artifacts or executes its PR checkout.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  review-event:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Review changed; the trusted required gate will evaluate current PR state.'
