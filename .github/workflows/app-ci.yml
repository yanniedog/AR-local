name: app-ci

# Run the complete producer-side Python suite for payload, ingest, ledger, dashboard,
# and Pi safety changes. The installable app and its CI live in yanniedog/AR-app.
on:
  pull_request:
    paths:
      - 'app_payload*.py'
      - 'app_sample.py'
      - 'contracts/**'
      - 'cdr_*.py'
      - 'cdr_terms/**'
      - 'pi_*.py'
      - 'laptop_*.py'
      - 'process_safety.py'
      - 'laptop_*.ps1'
      - 'native/**'
      - 'install_laptop_backup_task*.ps1'
      - 'install_laptop_backup_dispatcher*.ps1'
      - 'install_laptop_backup_nonadmin_dispatcher*.ps1'
      - 'install_laptop_backup_trusted_dispatcher*.ps1'
      - 'run_laptop_backup_task.ps1'
      - 'update_laptop_backup_user_session.ps1'
      - 'run_laptop_backup_dispatcher.ps1'
      - 'run_laptop_backup_nonadmin_dispatcher.ps1'
      - 'run_laptop_backup_trusted_child.ps1'
      - 'payload_crypto.py'
      - 'release_transport.py'
      - 'ar_local_pi_runtime.py'
      - 'ar_local_operation_lock.py'
      - 'verify_local*.py'
      - 'dashboard/**'
      - 'deploy/pi/**'
      - 'scripts/*.py'
      - 'cdr_domain/**'
      - 'cdr_pipeline/**'
      - 'cleanup_removed_cdr_sector.py'
      - 'requirements.txt'
      - 'requirements-terms.txt'
      - 'tests/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app_payload*.py'
      - 'app_sample.py'
      - 'contracts/**'
      - 'cdr_*.py'
      - 'cdr_terms/**'
      - 'pi_*.py'
      - 'laptop_*.py'
      - 'process_safety.py'
      - 'laptop_*.ps1'
      - 'native/**'
      - 'install_laptop_backup_task*.ps1'
      - 'install_laptop_backup_dispatcher*.ps1'
      - 'install_laptop_backup_nonadmin_dispatcher*.ps1'
      - 'install_laptop_backup_trusted_dispatcher*.ps1'
      - 'run_laptop_backup_task.ps1'
      - 'update_laptop_backup_user_session.ps1'
      - 'run_laptop_backup_dispatcher.ps1'
      - 'run_laptop_backup_nonadmin_dispatcher.ps1'
      - 'run_laptop_backup_trusted_child.ps1'
      - 'payload_crypto.py'
      - 'release_transport.py'
      - 'ar_local_pi_runtime.py'
      - 'ar_local_operation_lock.py'
      - 'verify_local*.py'
      - 'dashboard/**'
      - 'deploy/pi/**'
      - 'scripts/*.py'
      - 'cdr_domain/**'
      - 'cdr_pipeline/**'
      - 'cleanup_removed_cdr_sector.py'
      - 'requirements.txt'
      - 'requirements-terms.txt'
      - 'tests/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

jobs:
  process-liveness-windows:
    name: process liveness (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify liveness checks never signal their console
        run: python -m pytest tests/test_process_liveness_no_signals.py -q

  payload:
    name: payload builder (pytest)
    # The qualified Python 3.13.5 build exists on 24.04, not the moving 26.04 image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        # cryptography is an optional runtime dep (lazy import) but tests exercise the
        # payload-encryption path, so install it here to run those rather than skip.
        # openpyxl is test-only: production XLSX output remains stdlib-only.
        run: python -m pip install --quiet -r requirements.txt -r requirements-terms.txt cryptography openpyxl pytest
      - name: Verify PowerShell 7 for installer regression
        run: pwsh --version
      - name: Parse laptop backup PowerShell helpers
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath . -Filter 'laptop_*.ps1' | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($_.FullName)"
            }
          }
      - name: Verify retained category fixture equivalence
        # This full-source preparation check runs on CI, not inside the bounded
        # Pi pytest suite. Runtime tests consume the independently pinned stream.
        run: python -B scripts/regenerate-category-rate-fixture.py
      - name: Test
        # Run the whole server-side suite (payload, ribbon kernel, ledger
        # enforce/integrity, CDR retry/version-cache/breaker, budget probes, ...) so
        # these guards actually gate, not just test_app_payload.py.
        run: python -m pytest tests/ -q
      - name: Use the qualified Pi collection interpreter version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install matched collection dependencies
        # Match the qualified Pi runtime's collection-sensitive direct versions.
        # This remains CI-only; no packages or settings change on the Pi.
        run: python -m pip install --quiet pytest==9.1.1 jsonschema==4.26.0 pypdf==6.21.2 cryptography==43.0.0 openpyxl==3.1.5 zstandard==0.25.0 tzdata
      - name: Prove exhaustive partitioned collection equivalence
        # Keep post-test artifacts for diagnosis; qualify the same reviewed Git
        # commit in a pristine worktree rather than ignoring/cleaning extra files.
        run: |
          git status --porcelain --untracked-files=all
          git worktree add --detach "$RUNNER_TEMP/collection-source" HEAD
          python -B "$RUNNER_TEMP/collection-source/scripts/qualify-partitioned-collection.py" --output "$RUNNER_TEMP/collection-equivalence"
      - name: Retain native collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-equivalence
          path: ${{ runner.temp }}/collection-equivalence
          if-no-files-found: error

  dispatcher-windows:
    name: dispatcher contract (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install focused test dependency
        run: python -m pip install --quiet pytest
      - name: Verify Windows PowerShell 5.1 is present
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)."
          }
      - name: Configure the MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Parse trusted child with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @(
            'run_laptop_backup_trusted_child.ps1',
            'install_laptop_backup_trusted_dispatcher.ps1',
            'install_laptop_backup_trusted_dispatcher_core.ps1'
          )) {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Trusted PowerShell parse failed: $path"
            }
          }
      - name: Run dispatcher and dual-host installer contracts
        shell: powershell
        env:
          # GitHub's Windows runner token is elevated; dispatcher tests use the
          # guarded pytest-only override to exercise the required limited token.
          AR_DISPATCHER_TEST_ADMIN: '0'
        run: >-
          python -m pytest -q
          tests/test_laptop_backup_dispatcher.py
          tests/test_laptop_backup_dispatcher_installer.py
          tests/test_laptop_backup_nonadmin_dispatcher.py
          tests/test_laptop_backup_restricted_process.py
          tests/test_laptop_backup_trusted_launcher.py
          tests/test_laptop_backup_trusted_dispatcher_installer.py
          tests/test_laptop_recovery_lock.py
          tests/test_laptop_backup_git_dependency.py
