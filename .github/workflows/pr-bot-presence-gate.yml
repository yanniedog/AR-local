name: pr-bot-presence-gate

# Reviewer presence is advisory. Run only on explicit dispatch; vendors require
# an operator opt-in through the AR_BOT_WAIT_REQUIRED repository variable.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  bot-presence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Optional reviewer presence check
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          AR_BOT_WAIT_REQUIRED: ${{ vars.AR_BOT_WAIT_REQUIRED || 'off' }}
          BOT_WAIT_IGNORE_CHECK_NAMES: bot-presence-gate,bot-feedback-gate,pr-bot-presence-gate,pr-bot-feedback-check
          # CI has no .ar-bot-wait state; anchor falls back to PR createdAt (long-open PRs exceed 28m).
          BOT_WAIT_MAX_MIN: "240"
        run: |
          if [ "$AR_BOT_WAIT_REQUIRED" = "off" ]; then
            echo "Reviewer presence is advisory; no vendors explicitly required."
            exit 0
          fi
          npm run wait-for-bots -- --pr "$PR"
