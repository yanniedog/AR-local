name: pr-bot-presence-gate

# Read-only diagnostic, never PR-head merge evidence. Local closeout evaluates
# explicit reviewer opt-in itself. The repository variable opts into this
# diagnostic only; it does not change the universal server merge requirements.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  issues: read
  statuses: read

jobs:
  reviewer-presence-diagnostic:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Optional reviewer presence check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          AR_BOT_WAIT_REQUIRED: ${{ vars.AR_BOT_WAIT_REQUIRED || 'off' }}
          BOT_WAIT_IGNORE_CHECK_NAMES: bot-presence-gate,bot-feedback-gate,pr-bot-presence-gate,pr-bot-feedback-check
          # CI has no .ar-bot-wait state; anchor falls back to PR createdAt (long-open PRs exceed 28m).
          BOT_WAIT_MAX_MIN: "240"
        run: |
          node -e 'const raw=process.env.PR; if (!/^[1-9][0-9]*$/.test(raw || "") || !Number.isSafeInteger(Number(raw))) { console.error("pr_number must be a positive safe integer"); process.exit(1); }'
          policy=$(printf '%s' "$AR_BOT_WAIT_REQUIRED" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$policy" ] || [ "$policy" = "off" ] || [ "$policy" = "none" ] || [ "$policy" = "disabled" ]; then
            echo "Reviewer presence is advisory; no vendors explicitly required."
            exit 0
          fi
          npm run wait-for-bots -- --pr "$PR"
