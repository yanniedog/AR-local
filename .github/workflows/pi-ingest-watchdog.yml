# Off-Pi publication monitoring. Scheduled delivery can be delayed by GitHub.
name: pi-ingest-watchdog

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pi-ingest-watchdog
  cancel-in-progress: false

jobs:
  manifest-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Install watchdog dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt

      - name: Check publication and reconcile its daily issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_AVAILABLE: ${{ steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Keep evidence even if checkout, setup, or the controller itself fails.
          printf '%s\n' '{"schema_version":1,"status":"UNKNOWN","reason":"CHECK_INFRASTRUCTURE_FAILED","delivery":{"status":"NOT_ATTEMPTED"}}' > check.json
          if [ "$CHECKER_AVAILABLE" = "true" ]; then
            python scripts/pi_ingest_cloud_incident.py --output check.json
          else
            python scripts/pi_ingest_cloud_incident.py --output check.json --checker-unavailable
          fi

      - name: Retain publication check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-ingest-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: check.json
          if-no-files-found: error
          retention-days: 30
